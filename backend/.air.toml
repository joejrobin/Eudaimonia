# Live reload for `devenv up` / local development. https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "migrations"]
  delay = 500
  stop_on_error = true

[log]
  time = false
